<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:440px;height:280px;background:#203f73;display:grid;place-items:center}
.card{width:332px;height:196px;background:#f7f9fc;border-radius:22px;padding:26px 28px;box-shadow:0 10px 24px #13294466}
.row{display:flex;align-items:center;justify-content:space-between}.swatch{width:66px;height:62px;border:2px solid #243b53;border-radius:12px;display:grid;place-items:center}
.left{background:#d84944}.right{background:#2979ff}.arrow{width:60px;height:8px;border-radius:4px;background:#243b53;position:relative}.arrow:after{content:"";position:absolute;right:0;top:-8px;width:20px;height:20px;border-top:7px solid #243b53;border-right:7px solid #243b53;transform:rotate(45deg)}
.track{height:7px;background:#c2cede;border-radius:6px;position:relative;margin-top:40px}.track:before{content:"";position:absolute;width:57%;height:100%;background:#203f73;border-radius:6px}.track:after{content:"";position:absolute;left:54%;top:-7px;width:22px;height:22px;border:3px solid white;border-radius:50%;background:#203f73;outline:2px solid #203f73}
.line{width:27px;height:5px;background:white;border-radius:3px}.check{width:26px;height:15px;border-bottom:5px solid white;border-left:5px solid white;transform:rotate(-45deg);margin-top:-5px}
</style></head><body><div class="card"><div class="row"><div class="swatch left"><div class="line"></div></div><div class="arrow"></div><div class="swatch right"><div class="check"></div></div></div><div class="track"></div></div></body></html>
