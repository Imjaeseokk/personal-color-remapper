<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Color Remapper</title><link rel="stylesheet" href="../ui/shared.css"><link rel="stylesheet" href="popup.css">
<script src="../utils/constants.js" defer></script><script src="../utils/color.js" defer></script><script src="../utils/domain.js" defer></script><script src="../utils/model.js" defer></script><script src="../utils/storage.js" defer></script><script src="../ui/rule-editor.js" defer></script><script src="popup.js" defer></script></head>
<body><header class="row between"><div class="row"><span class="swatchmark" aria-hidden="true">↔</span><div><h1>Color Remapper</h1><small>Your colors. Your clarity.</small></div></div><label class="toggle"><input id="enabled" type="checkbox" disabled>ON</label></header>
<main><section class="card stack"><div><div class="eyebrow">Current site</div><strong id="domain">Loading…</strong></div><label class="toggle"><input id="site-enabled" type="checkbox" disabled>Enable on this site</label><label class="name">Profile name<input id="name" type="text" maxlength="100" disabled></label><small id="global-info"></small></section>
<div class="row between section-heading"><h2>Color rules</h2><small>First match wins</small></div><p class="help">Similarity: 0 exact · 15 nearby · 100 broad</p><div id="rules"></div><button id="add" class="full" disabled>+ Add color rule</button><button id="pick" class="full" disabled>⌖ Pick color from page</button>
</main><footer><p id="status" class="status" role="status" aria-live="polite"></p><div class="row"><button id="save" class="primary full" disabled>Save for site</button><button id="cancel" disabled>Cancel</button></div><p class="help">Closing discards unsaved edits. Save enables automatic site access.</p><button id="options" class="link">Advanced settings →</button></footer></body></html>
